version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gaytak-db
    environment:
      POSTGRES_DB: gaytak
      POSTGRES_USER: gaytak
      POSTGRES_PASSWORD: gaytak123
    ports:
      - "5432:5432"
    volumes:
      - gaytak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaytak -d gaytak"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-server:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.api
    container_name: gaytak-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql://gaytak:gaytak123@postgres:5432/gaytak"
      PORT: "8080"
      BASE_PATH: "/api"
      NODE_ENV: "development"
      SESSION_SECRET: "dev-secret-key-123"
      ADMIN_EMAIL: "admin@gaytak.com"
      ADMIN_PASSWORD: "gaytak@2025"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./artifacts/api-server/src:/app/artifacts/api-server/src:ro
    command: ["sh", "-c", "pnpm --filter @workspace/db run push-force && pnpm --filter @workspace/api-server run start"]

volumes:
  gaytak_postgres_data:
