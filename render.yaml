services:
  - type: web
    name: gaytak-api
    runtime: node
    plan: free
    buildCommand: |
      npx --yes pnpm@9 install --frozen-lockfile --ignore-scripts
      npx --yes pnpm@9 --filter @workspace/api-server run build
    startCommand: cd artifacts/api-server && node dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080

  - type: static
    name: gaytak-marketplace
    plan: free
    buildCommand: |
      npx --yes pnpm@9 install --frozen-lockfile --ignore-scripts
      PORT=3000 BASE_PATH=/ npx --yes pnpm@9 --filter @workspace/marketplace run build
    staticPublishPath: artifacts/marketplace/dist/public
    routes:
      - type: rewrite
        source: /api/*
        destination: https://gaytak-api.onrender.com/api/$1
      - type: rewrite
        source: /*
        destination: /index.html
